# AARDS Backend configuration
server.port=8080

# Datasource - override via env vars in Railway / local
# spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aards}
# spring.datasource.username=${DB_USERNAME:postgres}
# spring.datasource.password=${DB_PASSWORD:postgres}
# spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.url=jdbc:postgresql://localhost:5432/aards
spring.datasource.username=postgres
spring.datasource.password=968962
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT (HS256 needs a long random secret, at least 32 chars)
aards.jwt.secret=${JWT_SECRET:CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_AT_LEAST_32_CHARS}
aards.jwt.expiration=86400000
app.jwt.secret=${JWT_SECRET:CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_AT_LEAST_32_CHARS}
app.jwt.expiration-ms=86400000

# Gemini AI (placeholder - business rules stay in-app, Gemini only rewrites professionally)
app.gemini.api-key=${GEMINI_API_KEY:change-me}
app.gemini.model=gemini-1.5-flash
app.gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models

# Upload / PDF storage (original PDFs remain available)
app.upload.dir=${UPLOAD_DIR:uploads}
aards.upload.dir=./uploads
aards.parser.strategy=default
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Tesseract OCR datapath (fallback for scanned PDFs)
app.ocr.datapath=${OCR_DATAPATH:tessdata}
app.ocr.language=eng



