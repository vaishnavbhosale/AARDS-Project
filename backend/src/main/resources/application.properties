# AARDS Backend configuration
server.port=8080

# Datasource - override via env vars in Railway / local
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aards}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret=${JWT_SECRET:change-me-to-a-256-bit-secret-for-local-dev-only-0123456789}
app.jwt.expiration-ms=86400000

# Gemini AI (placeholder - business rules stay in-app, Gemini only rewrites professionally)
app.gemini.api-key=${GEMINI_API_KEY:change-me}
app.gemini.model=gemini-1.5-flash
app.gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models

# Upload / PDF storage (original PDFs remain available)
app.upload.dir=${UPLOAD_DIR:uploads}
aards.upload.dir=./uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Tesseract OCR datapath (fallback for scanned PDFs)
app.ocr.datapath=${OCR_DATAPATH:tessdata}
app.ocr.language=eng
