spring.application.name=aards-backend
server.port=${PORT:8080}

# Datasource — all values from env vars (no local fallbacks with secrets)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT
aards.jwt.secret=${JWT_SECRET:aards-dev-only-secret-change-me-in-production-min-32-chars}
aards.jwt.expiration=86400000

# Upload
aards.upload.dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Parser
aards.parser.strategy=default
aards.ocr.enabled=false

# CORS
aards.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Logging
logging.level.com.aards=INFO
logging.level.root=WARN
